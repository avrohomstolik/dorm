<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dorm Check-In</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f4f6f8; margin: 0; padding: 15px; color: #333; }
    header { background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 15px; }
    .curfew-bar { display: flex; align-items: center; justify-content: space-between; font-weight: bold; }
    input[type="time"] { padding: 6px 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
    
    .nav-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
    .nav-tab { flex: 1; padding: 12px; text-align: center; background: #e0e0e0; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; }
    .nav-tab.active { background: #2196F3; color: white; }
    
    .floor-title { font-size: 18px; font-weight: bold; margin: 20px 0 10px 0; color: #1565C0; border-bottom: 2px solid #1565C0; padding-bottom: 4px; }
    .room-card { background: white; padding: 12px; border-radius: 10px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .room-title { font-size: 15px; font-weight: bold; margin-bottom: 8px; color: #555; }
    
    .resident-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; }
    .resident-row:last-child { border-bottom: none; }
    .resident-name { font-size: 15px; font-weight: 500; }
    
    .btn-group { display: flex; gap: 6px; }
    .btn { border: none; padding: 8px 12px; border-radius: 6px; color: white; font-weight: bold; font-size: 13px; cursor: pointer; user-select: none; }
    .btn-ontime { background: #4CAF50; }
    .btn-late { background: #FF9800; }
    .btn-reset { background: #757575; }
    
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; color: white; }
    .badge-ontime { background: #4CAF50; }
    .badge-late { background: #FF9800; }
    .badge-absent { background: #F44336; }
    
    .hidden { display: none; }
  </style>
</head>
<body>

  <header>
    <div class="curfew-bar">
      <span>Lights Out Curfew:</span>
      <input type="time" id="curfewTime" value="22:00">
    </div>
  </header>

  <div class="nav-tabs">
    <button class="nav-tab active" id="tabMain" onclick="switchTab('main')">To Check In</button>
    <button class="nav-tab" id="tabChecked" onclick="switchTab('checked')">Checked In (<span id="countChecked">0</span>)</button>
  </div>

  <div id="viewMain"></div>
  <div id="viewChecked" class="hidden"></div>

  <script>
    const GOOGLE_SHEET_WEB_APP_URL = "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE";

    const initialData = [
      { floor: "First Floor", room: "Room 1", residents: ["Yosef Lazurus", "Mendel Landu", "Nachi Hoen", "Mednel Minkowitz"] },
      { floor: "First Floor", room: "Room 2", residents: ["Yossi Andrusier", "Ahron Whilhelm", "Shmuel Simon", "Menachem Fishbein"] },
      { floor: "First Floor", room: "Room 3", residents: ["Rafi Rud", "Hirsch Perlman", "Shmuel Sandman", "Yisrael Rubashkin"] },
      { floor: "Second Floor", room: "Room 1", residents: ["Micha Lipskier", "Yakov Elisheveitz", "Dovber Mendelow", "Eli Chein", "Eli Edielkopf"] },
      { floor: "Second Floor", room: "Room 2", residents: ["Yisrael Web", "Gabi Rosenstein"] },
      { floor: "Second Floor", room: "Room 3", residents: ["Shlomo Tzweibel", "Zalmy Rosenfeld", "Zev Silverman", "Shneur Thaler"] },
      { floor: "Third Floor", room: "Room 1", residents: ["Mendel Raskin", "Moshe Greizman", "Levi Weirtzberg"] },
      { floor: "Third Floor", room: "Room 2", residents: ["Mendel Bogart", "Mendel Borenstein", "Mendel Vishetzsky"] }
    ];

    let checkIns = JSON.parse(localStorage.getItem('dormCheckIns')) || {};

    function saveState() {
      localStorage.setItem('dormCheckIns', JSON.stringify(checkIns));
      render();
    }

    function calculateLateMinutes(manualTime = null) {
      const now = manualTime ? new Date(manualTime) : new Date();
      const curfewVal = document.getElementById('curfewTime').value;
      const [hours, minutes] = curfewVal.split(':');
      
      const curfewDate = new Date();
      curfewDate.setHours(parseInt(hours), parseInt(minutes), 0, 0);

      const diffMs = now - curfewDate;
      const diffMins = Math.floor(diffMs / 60000);
      return diffMins > 0 ? diffMins : 0;
    }

    function handleCheckIn(name, floor, room, status, manualMins = null) {
      const now = new Date();
      let lateMins = 0;
      
      if (status === 'Late') {
        lateMins = manualMins !== null ? manualMins : calculateLateMinutes();
      }

      const record = {
        name, floor, room, status,
        minutesLate: lateMins,
        timestamp: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        date: now.toISOString().split('T')[0]
      };

      checkIns[name] = record;
      saveState();
      sendToGoogleSheet(record);
    }

    function resetResident(name) {
      delete checkIns[name];
      saveState();
    }

    function sendToGoogleSheet(record) {
      if (!GOOGLE_SHEET_WEB_APP_URL || GOOGLE_SHEET_WEB_APP_URL.includes("YOUR_GOOGLE")) return;
      fetch(GOOGLE_SHEET_WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(record)
      });
    }

    function setupHoldEvents(element, onNormal, onHold) {
      let timer;
      let isHold = false;

      const start = (e) => {
        isHold = false;
        timer = setTimeout(() => {
          isHold = true;
          onHold();
        }, 600);
      };

      const cancel = (e) => {
        clearTimeout(timer);
      };

      const click = (e) => {
        if (!isHold) onNormal();
      };

      element.addEventListener('touchstart', start);
      element.addEventListener('touchend', (e) => { cancel(e); click(e); });
      element.addEventListener('mousedown', start);
      element.addEventListener('mouseup', (e) => { cancel(e); click(e); });
      element.addEventListener('mouseleave', cancel);
    }

    function render() {
      const mainView = document.getElementById('viewMain');
      const checkedView = document.getElementById('viewChecked');
      mainView.innerHTML = '';
      checkedView.innerHTML = '';

      let checkedCount = 0;

      initialData.forEach(section => {
        let mainRoomHtml = '';
        let checkedRoomHtml = '';

        section.residents.forEach(res => {
          const statusObj = checkIns[res];

          if (!statusObj) {
            // Main view row
            const row = document.createElement('div');
            row.className = 'resident-row';
            row.innerHTML = `<span class="resident-name">${res}</span><div class="btn-group"></div>`;
            
            const btnGroup = row.querySelector('.btn-group');
            
            // On Time Button
            const btnOnTime = document.createElement('button');
            btnOnTime.className = 'btn btn-ontime';
            btnOnTime.innerText = 'On Time';
            setupHoldEvents(btnOnTime, 
              () => handleCheckIn(res, section.floor, section.room, 'On Time'),
              () => handleCheckIn(res, section.floor, section.room, 'Absent')
            );

            // Late Button
            const btnLate = document.createElement('button');
            btnLate.className = 'btn btn-late';
            btnLate.innerText = 'Late';
            setupHoldEvents(btnLate,
              () => handleCheckIn(res, section.floor, section.room, 'Late'),
              () => {
                const customMins = prompt(`Enter minutes late for ${res}:`, calculateLateMinutes());
                if (customMins !== null) {
                  handleCheckIn(res, section.floor, section.room, 'Late', parseInt(customMins) || 0);
                }
              }
            );

            btnGroup.appendChild(btnOnTime);
            btnGroup.appendChild(btnLate);
            mainRoomHtml += row.outerHTML;
          } else {
            // Checked view row
            checkedCount++;
            let badgeClass = 'badge-ontime';
            let label = 'On Time';
            if (statusObj.status === 'Late') {
              badgeClass = 'badge-late';
              label = `Late (${statusObj.minutesLate}m)`;
            } else if (statusObj.status === 'Absent') {
              badgeClass = 'badge-absent';
              label = 'Absent';
            }

            checkedRoomHtml += `
              <div class="resident-row">
                <span class="resident-name">${res}</span>
                <div>
                  <span class="badge ${badgeClass}">${label}</span>
                  <button class="btn btn-reset" onclick="resetResident('${res}')">Undo</button>
                </div>
              </div>`;
          }
        });

        // Append to Main View
        if (mainRoomHtml !== '') {
          mainView.innerHTML += `
            <div class="floor-title">${section.floor}</div>
            <div class="room-card">
              <div class="room-title">${section.room}</div>
              ${mainRoomHtml}
            </div>`;
        }

        // Append to Checked View
        if (checkedRoomHtml !== '') {
          checkedView.innerHTML += `
            <div class="floor-title">${section.floor}</div>
            <div class="room-card">
              <div class="room-title">${section.room}</div>
              ${checkedRoomHtml}
            </div>`;
        }
      });

      document.getElementById('countChecked').innerText = checkedCount;
      rebindEvents();
    }

    function rebindEvents() {
      // Re-attach JS listeners dynamically created in string template
      initialData.forEach(section => {
        section.residents.forEach(res => {
          if (!checkIns[res]) {
            const rows = document.querySelectorAll('.resident-row');
            rows.forEach(row => {
              if (row.querySelector('.resident-name')?.innerText === res) {
                const btnOnTime = row.querySelector('.btn-ontime');
                const btnLate = row.querySelector('.btn-late');
                
                if (btnOnTime) {
                  setupHoldEvents(btnOnTime,
                    () => handleCheckIn(res, section.floor, section.room, 'On Time'),
                    () => handleCheckIn(res, section.floor, section.room, 'Absent')
                  );
                }
                if (btnLate) {
                  setupHoldEvents(btnLate,
                    () => handleCheckIn(res, section.floor, section.room, 'Late'),
                    () => {
                      const customMins = prompt(`Enter minutes late for ${res}:`, calculateLateMinutes());
                      if (customMins !== null) {
                        handleCheckIn(res, section.floor, section.room, 'Late', parseInt(customMins) || 0);
                      }
                    }
                  );
                }
              }
            });
          }
        });
      });
    }

    function switchTab(tab) {
      if (tab === 'main') {
        document.getElementById('viewMain').classList.remove('hidden');
        document.getElementById('viewChecked').classList.add('hidden');
        document.getElementById('tabMain').classList.add('active');
        document.getElementById('tabChecked').classList.remove('active');
      } else {
        document.getElementById('viewMain').classList.add('hidden');
        document.getElementById('viewChecked').classList.remove('hidden');
        document.getElementById('tabMain').classList.remove('active');
        document.getElementById('tabChecked').classList.add('active');
      }
    }

    render();
  </script>
</body>
</html>
